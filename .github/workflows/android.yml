name: Android APK
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch verified Android zsign binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/zsign/arm64-v8a app/src/main/assets/zsign/armeabi-v7a
          curl -fL --retry 3 "https://github.com/zhlynn/zsign/releases/download/v1.1.3/zsign-android-arm64-v8a.tar.gz" -o /tmp/zsign-arm64.tar.gz
          echo "f042e585ce3cf93fef67efcdd3d139114948b12858877847fe67328d26e87cb0  /tmp/zsign-arm64.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zsign-arm64.tar.gz -C app/src/main/assets/zsign/arm64-v8a
          curl -fL --retry 3 "https://github.com/zhlynn/zsign/releases/download/v1.1.3/zsign-android-armeabi-v7a.tar.gz" -o /tmp/zsign-armv7.tar.gz
          echo "3994068f4d3d1bb3157f98ed987373155510c0b327fc8b4b8395692b9ee83733  /tmp/zsign-armv7.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zsign-armv7.tar.gz -C app/src/main/assets/zsign/armeabi-v7a
          chmod 755 app/src/main/assets/zsign/arm64-v8a/zsign app/src/main/assets/zsign/armeabi-v7a/zsign
          file app/src/main/assets/zsign/arm64-v8a/zsign
          file app/src/main/assets/zsign/armeabi-v7a/zsign
          file app/src/main/assets/zsign/arm64-v8a/zsign | grep -q 'ARM aarch64'
          file app/src/main/assets/zsign/armeabi-v7a/zsign | grep -q 'ARM'
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - name: Verify signing engines are packaged in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/zsign/arm64-v8a/zsign'
          unzip -l "$APK" | grep -q 'assets/zsign/armeabi-v7a/zsign'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bo-Sideload-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Bo-Sideload nightly' }}
          target_commitish: main
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: false
          files: app/build/outputs/apk/debug/*.apk
